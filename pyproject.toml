[project]
name = "aerocontrol"
version = "0.1.0"
description = "Local-first operations desk for aviation teams."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==6.0.7",
    "crispy-bootstrap5==2026.3",
    "django-crispy-forms==2.7",
    "python-decouple==3.8",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    # R6.4: PDF export for the compliance report. Pure-Python, no system
    # package (Cairo/Pango, wkhtmltopdf) required on the Ubuntu VM deploy --
    # unlike weasyprint/xhtml2pdf's HTML-rendering route.
    "reportlab>=4.2,<5",
    # Direct dependency for the BLOQUE GEO KML parser (hardened lxml). It was
    # already in the tree transitively via python-docx; pinned here so the geo
    # module does not depend on that chain continuing to pull it.
    "lxml>=6.1,<7",
    "psycopg[binary]>=3.2,<4",
    "djangorestframework>=3.15,<4",
    "boto3>=1.35,<2",
    "gunicorn>=23,<27",
    "whitenoise>=6.9,<7",
    "django-axes>=7,<9",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "polib>=1.2,<2",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
exclude = [".venv", ".tmp-baseline", "migrations", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
# Existing compact model declarations are tracked for incremental refactoring.
ignore = ["E702", "F403", "F405"]

[tool.bandit]
# Test modules are excluded for the same reason tests.py already was: their
# literal "password" fixtures trip B106 without being a finding. B106 stays
# enabled everywhere else so a real hardcoded credential is still reported.
exclude_dirs = [".venv", ".tmp-baseline", "migrations", "tests.py", "test_"]
skips = ["B101", "B105"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*"]

[tool.coverage.report]
# Baseline measured 2026-07-24 (~84%). Raise this as coverage improves
# (MASTER_PLAN.md FASE 4); never lower it to make a red run pass.
fail_under = 83
show_missing = true
