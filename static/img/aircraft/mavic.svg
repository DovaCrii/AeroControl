  <ellipse cx="46" cy="132" rx="7" ry="3.2" fill="#8d97ab" stroke="none"/><ellipse cx="274" cy="132" rx="7" ry="3.2" fill="#8d97ab" stroke="none"/>
  <ellipse class="rotor" cx="46" cy="124" rx="54" ry="7.5" fill="url(#disc)" stroke-width="1.6"/>
