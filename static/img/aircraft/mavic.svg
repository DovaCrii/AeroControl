  <path d="M120 100 H200" fill="none" stroke="#7d869a" stroke-width="2" opacity=".7"/>
  <path d="M132 94 L132 98 M140 94 L140 98 M148 94 L148 98 M172 94 L172 98 M180 94 L180 98 M188 94 L188 98" stroke="#7d869a" stroke-width="2" fill="none"/>
  <rect x="130" y="124" width="60" height="9" rx="4.5" fill="url(#dark)" stroke-width="2.2"/>
  <circle cx="142" cy="128.5" r="2" fill="#7fe3ff" stroke="none"/><circle cx="178" cy="128.5" r="2" fill="#7fe3ff" stroke="none"/>
  <rect x="146" y="152" width="28" height="10" rx="3" fill="url(#dark)"/>
  <rect x="126" y="158" width="68" height="42" rx="17" fill="url(#dark)"/>
  <circle cx="160" cy="178" r="16" fill="url(#lens)" stroke="#2ec4b6" stroke-width="3.4"/>
  <circle cx="160" cy="178" r="9.5" fill="none" stroke="#0b1b2b" stroke-width="2"/>
  <circle cx="154" cy="172" r="3" fill="#fff" stroke="none" opacity=".95"/><circle cx="165" cy="183" r="1.6" fill="#ffc93c" stroke="none"/>
  <circle cx="139" cy="186" r="4.5" fill="#0b1b2b" stroke-width="2"/><circle cx="181" cy="186" r="4.5" fill="#0b1b2b" stroke-width="2"/>
  <circle cx="160" cy="93" r="9" fill="url(#glow)" stroke="none" class="led"/>
  <circle class="led" cx="160" cy="93" r="3.4" fill="#4ade80" stroke-width="1.4"/>
</g>
</svg>
