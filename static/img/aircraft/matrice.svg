  <circle cx="117" cy="36" r="4" fill="#ff8c42" stroke-width="2"/><circle cx="203" cy="36" r="4" fill="#ff8c42" stroke-width="2"/>
  <rect x="86" y="84" width="148" height="62" rx="20" fill="url(#body)"/>
  <rect x="98" y="92" width="52" height="14" rx="5" fill="url(#bat)" stroke-width="2.4"/><rect x="170" y="92" width="52" height="14" rx="5" fill="url(#bat)" stroke-width="2.4"/>
  <rect x="104" y="96" width="14" height="5" rx="2" fill="#4ade80" stroke="none"/><rect x="176" y="96" width="14" height="5" rx="2" fill="#4ade80" stroke="none"/>
  <rect x="104" y="118" width="112" height="11" rx="5.5" fill="#ffc93c" stroke-width="2.4"/>
  <path d="M120 122 H200" stroke="#fff" stroke-width="1.6" opacity=".55"/>
  <rect x="124" y="140" width="72" height="12" rx="6" fill="url(#dark)" stroke-width="2.4"/>
  <rect x="132" y="150" width="56" height="38" rx="14" fill="url(#dark)"/>
  <circle cx="148" cy="170" r="12" fill="url(#lens)" stroke="#ff8c42" stroke-width="3"/>
  <circle cx="148" cy="170" r="6.5" fill="none" stroke="#0b1b2b" stroke-width="1.8"/>
