  <circle cx="170" cy="168" r="1.8" fill="#fff" stroke="none"/>
  <circle cx="98" cy="136" r="8" fill="url(#glowr)" stroke="none" class="led"/><circle class="led" cx="98" cy="136" r="3.4" fill="#ff5a4f" stroke-width="1.5"/>
  <circle cx="222" cy="136" r="8" fill="url(#glowg)" stroke="none" class="led"/><circle class="led" cx="222" cy="136" r="3.4" fill="#4ade80" stroke-width="1.5"/>
</g>
</svg>
