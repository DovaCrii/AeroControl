  <ellipse class="rotor" cx="268" cy="66" rx="52" ry="7" fill="url(#disc)" stroke-width="1.6"/>
  <path d="M96 120 L82 188 H60 M224 120 L238 188 H260" fill="none" stroke-width="4"/>
  <path d="M60 188 H84 M236 188 H260" stroke-width="5.5"/>
