<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 0 348 220" role="img" aria-label="RPA">
<defs>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fe0d3"/><stop offset=".6" stop-color="#2ec4b6"/><stop offset="1" stop-color="#1b8f84"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6479"/><stop offset="1" stop-color="#232938"/></linearGradient>
<linearGradient id="arm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6eaf1"/><stop offset="1" stop-color="#98a1b3"/></linearGradient>
<radialGradient id="disc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffc93c" stop-opacity=".1"/><stop offset=".72" stop-color="#ffc93c" stop-opacity=".45"/><stop offset="1" stop-color="#ffc93c" stop-opacity=".12"/></radialGradient>
<radialGradient id="lens" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="#8fdcff"/><stop offset=".22" stop-color="#22507a"/><stop offset="1" stop-color="#050f1b"/></radialGradient>
<radialGradient id="glowg"><stop offset="0" stop-color="#4ade80" stop-opacity=".9"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
<radialGradient id="glowr"><stop offset="0" stop-color="#ff5a4f" stop-opacity=".9"/><stop offset="1" stop-color="#ff5a4f" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
.rotor{transform-box:fill-box;transform-origin:center;animation:blur .07s linear infinite alternate}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
.shadow{animation:shade 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes blur{from{transform:scaleX(.78)}to{transform:scaleX(1)}}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
@keyframes shade{from{transform:scaleX(1.04);opacity:.28}to{transform:scaleX(.92);opacity:.18}}
@media (prefers-reduced-motion:reduce){.rotor,.led,.bob,.shadow{animation:none}}
</style>
<ellipse class="shadow" cx="160" cy="205" rx="92" ry="8" fill="#1f2430" opacity=".25" filter="url(#soft)"/>
<g class="bob" stroke="#1f2430" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M122 100 L72 82 M198 100 L248 82" stroke-width="9"/><path d="M122 100 L72 82 M198 100 L248 82" stroke="url(#arm)" stroke-width="4.6"/>
  <ellipse cx="68" cy="80" rx="12" ry="8.5" fill="url(#dark)"/><ellipse cx="252" cy="80" rx="12" ry="8.5" fill="url(#dark)"/>
  <ellipse class="rotor" cx="66" cy="70" rx="46" ry="6.5" fill="url(#disc)" stroke-width="1.4" opacity=".8"/>
  <ellipse class="rotor" cx="254" cy="70" rx="46" ry="6.5" fill="url(#disc)" stroke-width="1.4" opacity=".8"/>
  <path d="M116 118 L58 136 M204 118 L262 136" stroke-width="11"/><path d="M116 118 L58 136 M204 118 L262 136" stroke="url(#arm)" stroke-width="6"/>
  <ellipse cx="52" cy="138" rx="14" ry="10" fill="url(#dark)"/><ellipse cx="268" cy="138" rx="14" ry="10" fill="url(#dark)"/>
  <ellipse class="rotor" cx="50" cy="126" rx="52" ry="7.5" fill="url(#disc)" stroke-width="1.6"/>
  <ellipse class="rotor" cx="270" cy="126" rx="52" ry="7.5" fill="url(#disc)" stroke-width="1.6"/>
  <path d="M124 150 L114 170 M196 150 L206 170" fill="none" stroke-width="3.6"/>
  <rect x="108" y="92" width="104" height="62" rx="24" fill="url(#body)"/>
  <path d="M124 104 H196" stroke="#fff" stroke-width="2.2" opacity=".55" fill="none"/>
  <rect x="146" y="150" width="28" height="9" rx="3" fill="url(#dark)"/>
  <rect x="128" y="156" width="64" height="40" rx="16" fill="url(#dark)"/>
  <circle cx="160" cy="176" r="15" fill="url(#lens)" stroke="#ffc93c" stroke-width="3.2"/>
  <circle cx="160" cy="176" r="8.5" fill="none" stroke="#0b1b2b" stroke-width="2"/>
  <circle cx="155" cy="171" r="2.8" fill="#fff" stroke="none"/>
  <circle cx="126" cy="124" r="8" fill="url(#glowr)" stroke="none" class="led"/><circle class="led" cx="126" cy="124" r="3.2" fill="#ff5a4f" stroke-width="1.4"/>
  <circle cx="194" cy="124" r="8" fill="url(#glowg)" stroke="none" class="led"/><circle class="led" cx="194" cy="124" r="3.2" fill="#4ade80" stroke-width="1.4"/>
</g>
</svg>
