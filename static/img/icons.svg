<!-- UX-05: los 28 iconos del menu, en un solo archivo.

     Cada simbolo se llama por el DESTINO al que acompana y no por un
     numero: un `icon-3` obliga a abrir el archivo para saber cual es, y
     el nombre del destino ya existe en `base.html` justo al lado.

     Sin `fill` ni `stroke` propios: los heredan de `.nav-icon` en
     `app.css`, que es lo que permite que el color lo siga poniendo la
     seccion del menu (LV-207). Un simbolo con color propio habria
     congelado los ocho colores de seccion dentro de este archivo. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
  <symbol id="icon-permission-list" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 13l2 2 4-4"/></symbol>
  <symbol id="icon-flight-request-list" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="icon-geo-plan-list" viewBox="0 0 24 24"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2z"/><path d="M9 3v16M15 5v16"/></symbol>
  <!-- UX-27: «¿Puedo volar?». Un visto dentro de un escudo, que es lo que la
       pantalla hace: comprobar antes de despegar. Ni el visto solo (lo usa
       `icon-monthly-review`) ni el escudo solo, para que a tamaño de menú no se
       confundan — `R103` pide un símbolo distinguible por entrada, no sólo
       distinto. -->
  <symbol id="icon-can-i-fly" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></symbol>
  <symbol id="icon-record-list" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 4v16M11 9h6M11 13h4"/></symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></symbol>
  <symbol id="icon-document-list" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
  <symbol id="icon-alert-list" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 22h4"/></symbol>
  <!-- UX-13: la bandeja de trabajo. Símbolo propio y no el de alertas, que era
       lo que yo iba a hacer: `R103` exige un icono distinto por entrada del menú
       justamente para que se lea de un vistazo, y el guardián lo atajó. Una
       bandeja de entrada, que es lo que la pantalla es. -->
  <symbol id="icon-work-tray" viewBox="0 0 24 24"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/></symbol>
  <symbol id="icon-kanban" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 8v8M13 8v5M18 8v8"/></symbol>
