# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Django 6.0, SQLite (PostgreSQL optional via DB_ENGINE), Python 3.12+, Bootstrap 5, DRF, HTMX
  Architecture: Modular monolith — 7 domain apps. Frontend/backend separation is deferred (YAGNI); see MASTER_PLAN.md.
  Testing: pytest-django configured (settings config.settings.dev); 269 tests; runner is `uv run pytest`.
  Style: Standard Django project layout with apps per domain.
  Data: D:\I+D\AeroOpsDesk_Data\ (outside repo).
  Planning source of truth: MASTER_PLAN.md (blocks/tracking) + AUDIT_CLAUDE.md (evidence).

rules:
  proposal:
    - Include rollback plan for risky changes
    - Keep scope minimal for first iterations
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: "uv run pytest"
  verify:
    test_command: "uv run pytest --cov=apps --cov-report=term-missing"
    build_command: "pwsh scripts/verify.ps1"
    coverage_threshold: 83  # enforced by fail_under in pyproject.toml (T0.4)
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  reason: "pytest-django configured; runner is `uv run pytest`. See MASTER_PLAN.md FASE 4 for coverage gaps."
  capabilities:
    test_runner: pytest
    layers:
      unit: { available: true, tool: pytest }
      integration: { available: true, tool: pytest-django }
      e2e: { available: false, tool: null }
    coverage: { available: true, command: "uv run pytest --cov=apps --cov-report=term-missing" }
    quality:
      linter: { available: true, command: "uv run ruff check ." }
      type_checker: { available: false, command: null }
      formatter: { available: true, command: "uv run ruff format --check ." }
  detected_at: "2026-07-25"
