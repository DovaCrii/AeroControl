name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-only-not-for-production
    steps:
      - uses: actions/checkout@v7
      # El contexto `runner` no existe en `jobs.<id>.env` (sólo github, needs,
      # strategy, matrix, vars, secrets, inputs): usarlo ahí aborta el workflow
      # al arrancar. Las rutas se exportan aquí, donde $RUNNER_TEMP sí existe.
      - name: Prepare working paths
        run: |
          echo "DB_PATH=$RUNNER_TEMP/aero-ops.sqlite3" >> "$GITHUB_ENV"
          echo "DOCUMENTS_DIR=$RUNNER_TEMP/documents" >> "$GITHUB_ENV"
          echo "LOGS_DIR=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          echo "BACKUPS_DIR=$RUNNER_TEMP/backups" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/documents" "$RUNNER_TEMP/logs" "$RUNNER_TEMP/backups"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run python scripts/compile_translations.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check --deploy
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest --cov=apps --cov-report=term-missing
      - run: uv run bandit -q -c pyproject.toml -r apps config
      - run: uv run pip-audit
      - name: Staging preflight
        run: |
          uv run python manage.py scale_readiness --json
          uv run python manage.py backup
          # `verify_backup` sin argumento verifica el último respaldo, así que no
          # hace falta pescarlo con `ls | head` -- un canal que además elegía
          # "el primero por nombre" y no "el recién creado", y que en un runner
          # con un solo respaldo acertaba por casualidad. Comprobado en `p340`
          # el 2026-08-28, que es donde se descubrió la forma sin argumento.
          uv run python manage.py verify_backup
