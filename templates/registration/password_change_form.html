{% extends "base.html" %}
{% load crispy_forms_tags i18n %}
{% block title %}{% translate "Change password" %} - AeroControl{% endblock %}
{% block content %}
<div class="form-shell card p-4" style="max-width: 32rem;">
  <div class="page-header">
    <h1 class="h3">{% translate "Change password" %}</h1>
  </div>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="form-actions d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary">{% translate "Update password" %}</button>
      <a href="{% url 'dashboard' %}" data-history-back class="btn btn-outline-secondary">{% translate "Cancel" %}</a>
    </div>
  </form>
</div>
{% endblock %}
